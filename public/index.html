<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudStream Web Library</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 15px; }
        .controls { display: flex; gap: 10px; margin: 20px 0; }
        input, select, button { padding: 10px; background: #161b22; border: 1px solid #30363d; color: white; border-radius: 6px; }
        button { background: #238636; border: none; cursor: pointer; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 10px; text-align: center; }
        .card img { width: 100%; height: 260px; object-fit: cover; border-radius: 4px; }
        .badge { display: inline-block; background: #1f6feb; padding: 3px 8px; font-size: 0.75rem; border-radius: 12px; margin-top: 5px; }
        .player-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
        .player-content { width: 90%; max-width: 900px; }
        .close-btn { background: #da3633; float: right; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Auto-Aggregated Library</h1>
        <span id="itemCount">Loading catalog...</span>
    </div>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search catalog..." onkeyup="fetchLibrary()">
        <select id="categorySelect" onchange="fetchLibrary()">
            <option value="all">All Categories</option>
            <option value="movie">Movies</option>
            <option value="anime">Anime</option>
        </select>
        <button onclick="fetchLibrary()">Refresh Library</button>
    </div>

    <div class="grid" id="libraryGrid"></div>

    <!-- Video Modal Player -->
    <div class="player-modal" id="playerModal">
        <div class="player-content">
            <button class="close-btn" onclick="closePlayer()">Close</button>
            <video id="activePlayer" class="video-js vjs-default-skin" controls preload="auto" style="width: 100%; height: 500px;"></video>
        </div>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
        let player = videojs('activePlayer');

        async function fetchLibrary() {
            const search = document.getElementById('searchInput').value;
            const category = document.getElementById('categorySelect').value;
            
            const res = await fetch(`/api/library?search=${encodeURIComponent(search)}&category=${category}`);
            const data = await res.json();

            document.getElementById('itemCount').innerText = `${data.count} titles loaded`;
            const grid = document.getElementById('libraryGrid');
            grid.innerHTML = '';

            data.library.forEach(item => {
                grid.innerHTML += `
                    <div class="card">
                        <img src="${item.poster}" alt="Poster">
                        <h4>${item.title}</h4>
                        <span class="badge">${item.provider}</span>
                        <br><br>
                        <button onclick="playStream('${item.provider}', '${item.sourceUrl}')">Watch Now</button>
                    </div>
                `;
            });
        }

        async function playStream(provider, url) {
            const res = await fetch(`/api/stream?provider=${encodeURIComponent(provider)}&targetUrl=${encodeURIComponent(url)}`);
            const data = await res.json();

            if (data.streamUrl) {
                document.getElementById('playerModal').style.display = 'flex';
                player.src({
                    src: data.streamUrl,
                    type: data.format === 'm3u8' ? 'application/x-mpegURL' : 'video/mp4'
                });
                player.play();
            }
        }

        function closePlayer() {
            player.pause();
            document.getElementById('playerModal').style.display = 'none';
        }

        // Initialize Library on Load
        fetchLibrary();
    </script>
</body>
</html>
