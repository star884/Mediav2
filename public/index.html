<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b10">
<meta name="color-scheme" content="dark">
<title>Mediav2</title>

<style>
:root{
    --bg:#080b10;
    --panel:#10151d;
    --panel2:#151b24;
    --panel3:#1b222d;
    --border:#252d38;
    --border2:#344052;
    --text:#f3f6fa;
    --muted:#8d98a8;
    --accent:#65a8ff;
    --accent2:#8abaff;
    --danger:#ff6574;
    --success:#63d89b;
    --warning:#f3c969;
    --radius:14px;
}

*{
    box-sizing:border-box;
}

html{
    min-height:100%;
    background:var(--bg);
}

body{
    margin:0;
    min-height:100vh;
    overflow-x:hidden;
    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(101,168,255,.08),
            transparent 35%
        ),
        var(--bg);
    color:var(--text);
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    cursor:not-allowed;
    opacity:.55;
}

button:focus-visible,
input:focus-visible,
select:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
}

header{
    position:sticky;
    top:0;
    z-index:50;
    display:grid;
    grid-template-columns:auto minmax(180px,720px) auto;
    align-items:center;
    gap:14px;
    padding:
        calc(12px + env(safe-area-inset-top))
        18px
        12px;
    background:rgba(8,11,16,.94);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);
}

.logo{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:20px;
    font-weight:800;
    white-space:nowrap;
}

.logo-mark{
    width:30px;
    height:30px;
    display:grid;
    place-items:center;
    border-radius:9px;
    background:var(--accent);
    color:#07101d;
    font-size:15px;
    font-weight:900;
}

.search{
    width:100%;
}

.search-box{
    position:relative;
}

.search input{
    width:100%;
    min-height:44px;
    padding:11px 44px 11px 16px;
    border:1px solid var(--border);
    border-radius:999px;
    background:var(--panel);
    color:var(--text);
    outline:none;
}

.search input::placeholder{
    color:var(--muted);
}

.search input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(101,168,255,.1);
}

.search-clear{
    position:absolute;
    top:50%;
    right:6px;
    width:32px;
    height:32px;
    transform:translateY(-50%);
    border:0;
    border-radius:50%;
    background:transparent;
    color:var(--muted);
    font-size:18px;
}

.search-clear:hover{
    background:var(--panel2);
    color:var(--text);
}

.controls{
    display:flex;
    align-items:center;
    gap:8px;
}

select,
.btn{
    min-height:42px;
    border:1px solid var(--border);
    border-radius:10px;
    padding:9px 12px;
    background:var(--panel);
    color:var(--text);
}

select:hover,
.btn:hover{
    border-color:var(--border2);
}

.btn-primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#07101d;
    font-weight:700;
}

.btn-primary:hover{
    border-color:var(--accent2);
    background:var(--accent2);
}

.btn-icon{
    width:42px;
    padding:0;
    display:grid;
    place-items:center;
}

main{
    width:min(1500px,100%);
    margin:0 auto;
    padding:20px;
}

.toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:18px;
}

.status{
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:4px;
}

.status-main{
    font-weight:700;
}

.status-sub{
    color:var(--muted);
    font-size:13px;
}

.view-controls{
    display:flex;
    gap:8px;
}

.grid{
    display:grid;
    grid-template-columns:
        repeat(
            auto-fill,
            minmax(155px,1fr)
        );
    gap:18px;
}

.card{
    min-width:0;
    overflow:hidden;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:var(--panel);
    transition:
        transform .15s ease,
        border-color .15s ease,
        box-shadow .15s ease;
}

.card:hover{
    transform:translateY(-3px);
    border-color:var(--border2);
    box-shadow:0 12px 30px rgba(0,0,0,.2);
}

.poster-wrap{
    position:relative;
    aspect-ratio:2/3;
    overflow:hidden;
    background:var(--panel2);
}

.poster{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
}

.poster-placeholder{
    width:100%;
    height:100%;
    display:grid;
    place-items:center;
    padding:16px;
    color:var(--muted);
    text-align:center;
    font-size:14px;
}

.badges{
    position:absolute;
    top:8px;
    left:8px;
    right:8px;
    display:flex;
    flex-wrap:wrap;
    gap:5px;
}

.badge{
    display:inline-flex;
    align-items:center;
    min-height:24px;
    padding:3px 7px;
    border-radius:7px;
    background:rgba(8,11,16,.8);
    color:var(--text);
    font-size:11px;
    font-weight:700;
    backdrop-filter:blur(8px);
}

.badge-provider{
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.card-body{
    padding:12px;
}

.title{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-weight:750;
}

.meta{
    margin-top:5px;
    min-height:18px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    color:var(--muted);
    font-size:12px;
}

.card-actions{
    display:grid;
    grid-template-columns:1fr auto;
    gap:7px;
    margin-top:10px;
}

.card-actions button{
    min-height:36px;
}

.favorite{
    width:38px;
    padding:0;
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--panel2);
    color:var(--text);
}

.favorite.active{
    color:var(--accent);
    border-color:var(--accent);
}

.empty{
    padding:70px 20px;
    text-align:center;
    color:var(--muted);
}

.empty strong{
    display:block;
    margin-bottom:7px;
    color:var(--text);
    font-size:17px;
}

.loading{
    display:flex;
    justify-content:center;
    padding:35px;
}

.spinner{
    width:28px;
    height:28px;
    border:3px solid var(--border);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin .75s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.overlay{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    background:rgba(0,0,0,.84);
}

.overlay.open{
    display:flex;
}

.modal{
    width:min(1100px,100%);
    max-height:calc(100vh - 36px);
    overflow:auto;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:var(--panel);
    box-shadow:0 30px 100px rgba(0,0,0,.5);
}

.modal-head{
    position:sticky;
    top:0;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:13px 16px;
    background:rgba(16,21,29,.95);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
}

.modal-title{
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-weight:750;
}

.modal-close{
    flex:0 0 auto;
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:var(--panel2);
    color:var(--text);
    font-size:21px;
}

.modal-close:hover{
    background:var(--panel3);
}

.player{
    background:#000;
}

video{
    width:100%;
    max-height:72vh;
    min-height:220px;
    display:block;
    background:#000;
}

.player-info{
    padding:14px 16px 18px;
}

.player-status{
    color:var(--muted);
    font-size:13px;
}

.sources{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
}

.source-btn{
    min-height:38px;
    border:1px solid var(--border);
    border-radius:9px;
    padding:7px 11px;
    background:var(--panel2);
    color:var(--text);
}

.source-btn:hover{
    border-color:var(--border2);
}

.source-btn.active{
    border-color:var(--accent);
    color:var(--accent);
}

.detail{
    display:grid;
    grid-template-columns:220px minmax(0,1fr);
    gap:20px;
    padding:20px;
}

.detail-poster{
    width:100%;
    aspect-ratio:2/3;
    object-fit:cover;
    border-radius:10px;
    background:var(--panel2);
}

.detail-placeholder{
    width:100%;
    aspect-ratio:2/3;
    display:grid;
    place-items:center;
    padding:15px;
    border-radius:10px;
    background:var(--panel2);
    color:var(--muted);
    text-align:center;
}

.detail-info{
    min-width:0;
}

.detail-title{
    margin:0;
    font-size:27px;
    line-height:1.15;
}

.detail-meta{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:10px;
}

.detail-chip{
    padding:5px 8px;
    border:1px solid var(--border);
    border-radius:7px;
    background:var(--panel2);
    color:var(--muted);
    font-size:12px;
}

.detail-description{
    margin-top:18px;
    color:var(--muted);
    line-height:1.65;
    white-space:pre-wrap;
}

.detail-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:18px;
}

.extension-panel{
    padding:18px 20px 20px;
}

.extension-list{
    display:grid;
    gap:8px;
}

.extension{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:11px 12px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--panel2);
}

.extension-name{
    font-weight:650;
}

.extension-meta{
    margin-top:3px;
    color:var(--muted);
    font-size:12px;
}

.extension-status{
    flex:0 0 auto;
    padding:5px 8px;
    border-radius:7px;
    font-size:11px;
    font-weight:700;
}

.extension-status.ok{
    color:var(--success);
    background:rgba(99,216,155,.08);
}

.extension-status.bad{
    color:var(--danger);
    background:rgba(255,101,116,.08);
}

.toast-container{
    position:fixed;
    right:16px;
    bottom:16px;
    z-index:300;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:8px;
    pointer-events:none;
}

.toast{
    max-width:min(420px,calc(100vw - 32px));
    padding:11px 14px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--panel);
    color:var(--text);
    box-shadow:0 12px 35px rgba(0,0,0,.3);
    font-size:13px;
    animation:toast-in .18s ease;
}

.toast.error{
    border-color:rgba(255,101,116,.5);
}

.toast.success{
    border-color:rgba(99,216,155,.5);
}

@keyframes toast-in{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.hidden{
    display:none!important;
}

@media(max-width:1000px){
    header{
        grid-template-columns:auto 1fr;
    }

    .search{
        grid-column:1/-1;
        grid-row:2;
    }

    .controls{
        justify-content:flex-end;
    }
}

@media(max-width:700px){
    header{
        padding-left:12px;
        padding-right:12px;
    }

    .logo{
        font-size:18px;
    }

    .controls select{
        max-width:115px;
    }

    main{
        padding:14px;
    }

    .toolbar{
        align-items:flex-start;
        flex-direction:column;
    }

    .view-controls{
        width:100%;
    }

    .view-controls select,
    .view-controls button{
        flex:1;
    }

    .grid{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
        gap:12px;
    }

    .card-body{
        padding:10px;
    }

    .detail{
        grid-template-columns:110px minmax(0,1fr);
        gap:14px;
        padding:14px;
    }

    .detail-title{
        font-size:20px;
    }

    .detail-description{
        grid-column:1/-1;
    }

    .detail-actions{
        grid-column:1/-1;
    }

    .overlay{
        padding:8px;
    }

    .modal{
        max-height:calc(100vh - 16px);
    }

    video{
        min-height:180px;
    }
}

@media(max-width:420px){
    .controls{
        width:100%;
    }

    .controls select{
        flex:1;
        max-width:none;
    }

    .controls .btn{
        width:42px;
    }

    .grid{
        gap:9px;
    }

    .badge{
        font-size:10px;
    }
}
</style>

</head>

<script>
'use strict';

/*
    Mediav2 frontend

    Backend endpoints expected:

        GET  /api/health
        GET  /api/providers
        GET  /api/extensions
        POST /api/extensions/sync
        GET  /api/library
        GET  /api/search?q=...
        POST /api/sync
        GET  /api/title/:id
        GET  /api/sources/:id

    The frontend never invents a playable URL.

    Playback is always performed using a source returned
    by the Mediav2 backend.
*/

const state = {
    results: [],
    currentTitle: null,
    currentSources: [],
    currentSourceIndex: -1,
    searchTimer: null,
    searchController: null,
    libraryController: null,
    lastQuery: '',
    lastMode: 'library',
    loading: false,
    syncInProgress: false
};

const $ = id => document.getElementById(id);

const elements = {
    searchInput: $('searchInput'),
    searchClear: $('searchClear'),
    typeSelect: $('typeSelect'),
    providerSelect: $('providerSelect'),
    refreshButton: $('refreshButton'),
    extensionsButton: $('extensionsButton'),

    results: $('results'),
    loading: $('loading'),
    empty: $('empty'),
    emptyText: $('emptyText'),

    statusText: $('statusText'),
    statusSub: $('statusSub'),

    playerOverlay: $('playerOverlay'),
    playerTitle: $('playerTitle'),
    video: $('video'),
    playerStatus: $('playerStatus'),
    sourceList: $('sourceList'),
    closePlayer: $('closePlayer'),

    detailOverlay: $('detailOverlay'),
    detailModalTitle: $('detailModalTitle'),
    detailContent: $('detailContent'),
    closeDetail: $('closeDetail'),

    extensionsOverlay: $('extensionsOverlay'),
    extensionList: $('extensionList'),
    closeExtensions: $('closeExtensions'),

    toastContainer: $('toastContainer')
};

/* ---------------------------------------------------------
   Utilities
--------------------------------------------------------- */

function escapeHtml(value) {
    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function normalizeType(value) {
    const type = String(value || '')
        .trim()
        .toLowerCase();

    if (
        type === 'tvseries' ||
        type === 'tv series' ||
        type === 'series' ||
        type === 'show'
    ) {
        return 'series';
    }

    if (
        type === 'movie' ||
        type === 'movies'
    ) {
        return 'movie';
    }

    if (
        type === 'anime'
    ) {
        return 'anime';
    }

    return 'other';
}

function typeLabel(value) {
    const type = normalizeType(value);

    if (type === 'movie') return 'Movie';
    if (type === 'series') return 'Series';
    if (type === 'anime') return 'Anime';

    return 'Other';
}

function formatDuration(seconds) {
    const value = Number(seconds);

    if (!Number.isFinite(value) || value <= 0) {
        return '';
    }

    const total = Math.floor(value);
    const hours = Math.floor(total / 3600);
    const minutes = Math.floor((total % 3600) / 60);

    if (hours > 0) {
        return `${hours}h ${minutes}m`;
    }

    return `${minutes}m`;
}

function formatDate(value) {
    if (!value) return '';

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return '';
    }

    return date.toLocaleDateString(
        undefined,
        {
            year: 'numeric',
            month: 'short',
            day: 'numeric'
        }
    );
}

function showToast(message, type = '') {
    const toast = document.createElement('div');

    toast.className =
        `toast${type ? ` ${type}` : ''}`;

    toast.textContent = message;

    elements.toastContainer.appendChild(toast);

    setTimeout(() => {
        toast.remove();
    }, 3500);
}

function setStatus(main, sub = '') {
    elements.statusText.textContent = main;
    elements.statusSub.textContent = sub;
}

function setLoading(value) {
    state.loading = value;
    elements.loading.classList.toggle(
        'hidden',
        !value
    );
}

function apiUrl(path, params = {}) {
    const url = new URL(
        path,
        window.location.origin
    );

    Object.entries(params).forEach(
        ([key, value]) => {
            if (
                value !== undefined &&
                value !== null &&
                value !== ''
            ) {
                url.searchParams.set(
                    key,
                    value
                );
            }
        }
    );

    return url.toString();
}

async function request(
    path,
    options = {}
) {
    const response = await fetch(
        path,
        {
            ...options,
            headers: {
                Accept: 'application/json',
                ...(options.headers || {})
            }
        }
    );

    let data = null;

    try {
        data = await response.json();
    } catch {
        data = null;
    }

    if (!response.ok) {
        const message =
            data?.error ||
            data?.message ||
            `Request failed (${response.status})`;

        throw new Error(message);
    }

    return data;
}

/* ---------------------------------------------------------
   Local state
--------------------------------------------------------- */

function favoriteKey(item) {
    return `mediav2:favorite:${item?.id || ''}`;
}

function progressKey(item) {
    return `mediav2:progress:${item?.id || ''}`;
}

function isFavorite(item) {
    if (!item?.id) return false;

    return (
        localStorage.getItem(
            favoriteKey(item)
        ) === '1'
    );
}

function toggleFavorite(item) {
    if (!item?.id) return false;

    const next = !isFavorite(item);

    if (next) {
        localStorage.setItem(
            favoriteKey(item),
            '1'
        );
    } else {
        localStorage.removeItem(
            favoriteKey(item)
        );
    }

    return next;
}

function getProgress(item) {
    if (!item?.id) return 0;

    const value = Number(
        localStorage.getItem(
            progressKey(item)
        )
    );

    return Number.isFinite(value)
        ? value
        : 0;
}

function saveProgress(item, seconds) {
    if (!item?.id) return;

    const value = Number(seconds);

    if (
        !Number.isFinite(value) ||
        value < 0
    ) {
        return;
    }

    localStorage.setItem(
        progressKey(item),
        String(Math.floor(value))
    );
}

function clearProgress(item) {
    if (!item?.id) return;

    localStorage.removeItem(
        progressKey(item)
    );
}

/* ---------------------------------------------------------
   Normalization
--------------------------------------------------------- */

function normalizeItem(item) {
    if (!item || typeof item !== 'object') {
        return null;
    }

    return {
        ...item,
        id: String(
            item.id ??
            item.url ??
            `${item.provider || 'unknown'}:${item.title || Math.random()}`
        ),
        title:
            String(
                item.title ??
                item.name ??
                'Untitled'
            ),
        provider:
            String(
                item.provider ??
                item.apiName ??
                'Unknown'
            ),
        type:
            normalizeType(
                item.type ??
                item.tvType
            ),
        poster:
            item.poster ??
            item.posterUrl ??
            null,
        url:
            item.url ??
            item.sourceUrl ??
            null,
        description:
            item.description ??
            '',
        year:
            item.year ??
            item.releaseYear ??
            null,
        duration:
            item.duration ??
            null
    };
}

function normalizeSource(source) {
    if (!source || typeof source !== 'object') {
        return null;
    }

    const url =
        source.url ??
        source.streamUrl ??
        source.link;

    if (!url) {
        return null;
    }

    return {
        ...source,
        url: String(url),
        name:
            String(
                source.name ??
                source.quality ??
                source.label ??
                'Source'
            ),
        quality:
            source.quality ??
            null,
        format:
            String(
                source.format ??
                source.type ??
                ''
            ).toLowerCase(),
        headers:
            source.headers || null,
        referer:
            source.referer ||
            source.referrer ||
            ''
    };
}

/* ---------------------------------------------------------
   Provider filter
--------------------------------------------------------- */

function populateProviders(
    items = state.results
) {
    const current =
        elements.providerSelect.value;

    const providers = [
        ...new Set(
            items
                .map(item =>
                    String(
                        item?.provider || ''
                    ).trim()
                )
                .filter(Boolean)
        )
    ].sort(
        (a, b) =>
            a.localeCompare(b)
    );

    elements.providerSelect.replaceChildren();

    const all = document.createElement('option');

    all.value = 'all';
    all.textContent = 'All providers';

    elements.providerSelect.appendChild(all);

    providers.forEach(provider => {
        const option =
            document.createElement('option');

        option.value = provider;
        option.textContent = provider;

        elements.providerSelect.appendChild(option);
    });

    if (
        providers.includes(current)
    ) {
        elements.providerSelect.value =
            current;
    } else {
        elements.providerSelect.value =
            'all';
    }
}

/* ---------------------------------------------------------
   Rendering
--------------------------------------------------------- */

function createPoster(item) {
    const wrap =
        document.createElement('div');

    wrap.className = 'poster-wrap';

    if (item.poster) {
        const image =
            document.createElement('img');

        image.className = 'poster';
        image.alt = item.title;
        image.loading = 'lazy';
        image.decoding = 'async';
        image.src = item.poster;

        image.addEventListener(
            'error',
            () => {
                image.remove();

                const placeholder =
                    document.createElement('div');

                placeholder.className =
                    'poster-placeholder';

                placeholder.textContent =
                    item.title;

                wrap.prepend(
                    placeholder
                );
            },
            { once: true }
        );

        wrap.appendChild(image);
    } else {
        const placeholder =
            document.createElement('div');

        placeholder.className =
            'poster-placeholder';

        placeholder.textContent =
            item.title;

        wrap.appendChild(
            placeholder
        );
    }

    const badges =
        document.createElement('div');

    badges.className = 'badges';

    const typeBadge =
        document.createElement('span');

    typeBadge.className = 'badge';
    typeBadge.textContent =
        typeLabel(item.type);

    badges.appendChild(typeBadge);

    if (item.provider) {
        const providerBadge =
            document.createElement('span');

        providerBadge.className =
            'badge badge-provider';

        providerBadge.textContent =
            item.provider;

        badges.appendChild(
            providerBadge
        );
    }

    wrap.appendChild(badges);

    return wrap;
}

function createCard(item) {
    const card =
        document.createElement('article');

    card.className = 'card';

    const poster =
        createPoster(item);

    const body =
        document.createElement('div');

    body.className = 'card-body';

    const title =
        document.createElement('div');

    title.className = 'title';
    title.title = item.title;
    title.textContent = item.title;

    const meta =
        document.createElement('div');

    meta.className = 'meta';

    const metaParts = [
        typeLabel(item.type),
        item.year
            ? String(item.year)
            : '',
        item.provider
            ? item.provider
            : ''
    ].filter(Boolean);

    meta.textContent =
        metaParts.join(' • ');

    const actions =
        document.createElement('div');

    actions.className =
        'card-actions';

    const watch =
        document.createElement('button');

    watch.type = 'button';
    watch.className =
        'btn btn-primary';

    const savedProgress =
        getProgress(item);

    watch.textContent =
        savedProgress > 0
            ? 'Resume'
            : 'Play';

    watch.addEventListener(
        'click',
        () => openPlayer(item)
    );

    const favorite =
        document.createElement('button');

    favorite.type = 'button';
    favorite.className =
        'favorite';

    favorite.setAttribute(
        'aria-label',
        'Toggle favorite'
    );

    function updateFavoriteButton() {
        const active =
            isFavorite(item);

        favorite.classList.toggle(
            'active',
            active
        );

        favorite.textContent =
            active
                ? '★'
                : '☆';
    }

    updateFavoriteButton();

    favorite.addEventListener(
        'click',
        () => {
            const active =
                toggleFavorite(item);

            updateFavoriteButton();

            showToast(
                active
                    ? 'Added to favorites'
                    : 'Removed from favorites',
                'success'
            );
        }
    );

    actions.appendChild(watch);
    actions.appendChild(favorite);

    body.appendChild(title);
    body.appendChild(meta);
    body.appendChild(actions);

    card.appendChild(poster);
    card.appendChild(body);

    card.addEventListener(
        'dblclick',
        () => openDetails(item)
    );

    return card;
}

function renderResults(items) {
    elements.results.replaceChildren();

    const normalized =
        items
            .map(normalizeItem)
            .filter(Boolean);

    state.results =
        normalized;

    populateProviders(
        normalized
    );

    const type =
        elements.typeSelect.value;

    const provider =
        elements.providerSelect.value;

    const filtered =
        normalized.filter(item => {
            if (
                type !== 'all' &&
                normalizeType(item.type) !==
                    normalizeType(type)
            ) {
                return false;
            }

            if (
                provider !== 'all' &&
                item.provider !== provider
            ) {
                return false;
            }

            return true;
        });

    filtered.forEach(item => {
        elements.results.appendChild(
            createCard(item)
        );
    });

    elements.countText = null;

    const count =
        filtered.length;

    if (count === 0) {
        elements.empty.classList.remove(
            'hidden'
        );
    } else {
        elements.empty.classList.add(
            'hidden'
        );
    }

    return filtered;
}

/* ---------------------------------------------------------
   Search/library
--------------------------------------------------------- */

function currentFilters() {
    return {
        type:
            elements.typeSelect.value,
        provider:
            elements.providerSelect.value
    };
}

async function loadLibrary() {
    if (state.searchController) {
        state.searchController.abort();
    }

    const controller =
        new AbortController();

    state.libraryController =
        controller;

    state.lastMode = 'library';

    setLoading(true);

    setStatus(
        'Loading library',
        'Fetching the current catalog...'
    );

    try {
        const filters =
            currentFilters();

        const params = {};

        if (
            filters.type !== 'all'
        ) {
            params.category =
                filters.type;
        }

        const data =
            await request(
                apiUrl(
                    '/api/library',
                    params
                ),
                {
                    signal:
                        controller.signal
                }
            );

        const items =
            Array.isArray(data?.library)
                ? data.library
                : Array.isArray(data)
                    ? data
                    : [];

        const normalized =
            items
                .map(normalizeItem)
                .filter(Boolean);

        state.results =
            normalized;

        populateProviders(
            normalized
        );

        renderResults(
            normalized
        );

        const count =
            renderResults(
                normalized
            ).length;

        setStatus(
            count === 1
                ? '1 title'
                : `${count} titles`,
            'Library'
        );

        elements.emptyText.textContent =
            'The library has no matching titles yet.';
    } catch (error) {
        if (
            error.name ===
            'AbortError'
        ) {
            return;
        }

        console.error(error);

        elements.results.replaceChildren();

        elements.empty.classList.remove(
            'hidden'
        );

        elements.emptyText.textContent =
            error.message;

        setStatus(
            'Library unavailable',
            'Check the server and try again.'
        );

        showToast(
            error.message,
            'error'
        );
    } finally {
        setLoading(false);
    }
}

async function searchEverything(query) {
    const q =
        String(query || '')
            .trim();

    if (!q) {
        return loadLibrary();
    }

    if (state.searchController) {
        state.searchController.abort();
    }

    const controller =
        new AbortController();

    state.searchController =
        controller;

    state.lastMode = 'search';
    state.lastQuery = q;

    setLoading(true);

    setStatus(
        `Searching for "${q}"`,
        'Searching available providers...'
    );

    try {
        const data =
            await request(
                apiUrl(
                    '/api/search',
                    {
                        q,
                        query: q
                    }
                ),
                {
                    signal:
                        controller.signal
                }
            );

        const raw =
            Array.isArray(data?.results)
                ? data.results
                : Array.isArray(data?.library)
                    ? data.library
                    : Array.isArray(data)
                        ? data
                        : [];

        const items =
            raw
                .map(normalizeItem)
                .filter(Boolean);

        state.results =
            items;

        populateProviders(
            items
        );

        const filtered =
            renderResults(
                items
            );

        setStatus(
            filtered.length === 1
                ? '1 result'
                : `${filtered.length} results`,
            `Search: ${q}`
        );

        elements.emptyText.textContent =
            `No results were found for "${q}".`;

    } catch (error) {
        if (
            error.name ===
            'AbortError'
        ) {
            return;
        }

        console.error(error);

        elements.results.replaceChildren();

        elements.empty.classList.remove(
            'hidden'
        );

        elements.emptyText.textContent =
            error.message;

        setStatus(
            'Search failed',
            'Try again in a moment.'
        );

        showToast(
            error.message,
            'error'
        );
    } finally {
        setLoading(false);
    }
}

function scheduleSearch() {
    clearTimeout(
        state.searchTimer
    );

    state.searchTimer =
        setTimeout(
            () => {
                const query =
                    elements.searchInput.value;

                searchEverything(query);
            },
            350
        );
}

function applyFilters() {
    if (
        elements.searchInput.value.trim()
    ) {
        searchEverything(
            elements.searchInput.value
        );
    } else {
        loadLibrary();
    }
}

   Details

async function openDetails(item) {
    if (!item) return;

    elements.detailOverlay.classList.add(
        'open'
    );

    elements.detailModalTitle.textContent =
        item.title;

    elements.detailContent.innerHTML =
        '<div class="loading"><div class="spinner"></div></div>';

    try {
        let data;

        if (item.id) {
            data =
                await request(
                    `/api/title/${encodeURIComponent(item.id)}`
                );
        }

            normalizeItem(
                data?.title ??
                data ??
                item
            );

        renderDetails(
            detail || item
        );

    } catch (error) {
        console.error(error);

        renderDetails(item);

        showToast(
            'Showing available details only.',
            'error'
        );

}

function renderDetails(item) {

            : `<div class="detail-placeholder">${escapeHtml(item.title)}</div>`;

/* ---------------------------------------------------------
   Player
--------------------------------------------------------- */

function closePlayer() {
    try {
        elements.video.pause();
    } catch {}

    elements.video.removeAttribute(
        'src'
    );

    elements.video.load();

    elements.playerOverlay.classList.remove(
        'open'
    );

    state.currentTitle = null;
    state.currentSources = [];
    state.currentSourceIndex = -1;

    elements.sourceList.replaceChildren();
}

function sourceIsUsable(source) {
    return Boolean(
        source &&
        typeof source.url === 'string' &&
        source.url.trim()
    );
}

function sourceLabel(source, index) {
    const pieces = [
        source.name,
        source.quality
            ? String(source.quality)
            : '',
        source.format
            ? source.format.toUpperCase()
            : ''
    ].filter(Boolean);

    return (
        pieces.join(' • ') ||
        `Source ${index + 1}`
    );
}

function getMimeType(source) {
    const format =
        String(
            source?.format || ''
        ).toLowerCase();

    if (
        format === 'm3u8' ||
        format === 'hls'
    ) {
        return 'application/x-mpegURL';
    }

    if (format === 'mp4') {
        return 'video/mp4';
    }

    if (format === 'webm') {
        return 'video/webm';
    }

    if (format === 'ogg' ||
        format === 'ogv') {
        return 'video/ogg';
    }

    return '';
}

function renderSources() {
    elements.sourceList.replaceChildren();

    state.currentSources.forEach(
        (source, index) => {
            const button =
                document.createElement('button');

            button.type = 'button';
            button.className =
                'source-btn';

            if (
                index ===
                state.currentSourceIndex
            ) {
                button.classList.add(
                    'active'
                );
            }

            button.textContent =
                sourceLabel(
                    source,
                    index
                );

            button.addEventListener(
                'click',
                () => {
                    playSource(index);
                }
            );

            elements.sourceList.appendChild(
                button
            );
        }
    );
}

function attemptAutoplay() {
    const video =
        elements.video;

    video.autoplay = true;

    const promise =
        video.play();

    if (
        promise &&
        typeof promise.catch ===
            'function'
    ) {
        promise.catch(() => {
            /*
                Browser autoplay policies may
                reject audible autoplay.

                We do not fake success here.
                The controls remain available
                for the user to start playback.
            */

            elements.playerStatus.textContent =
                'Ready — press play if your browser blocked autoplay.';
        });
    }
}

function playSource(index) {
    const source =
        state.currentSources[index];

    if (!sourceIsUsable(source)) {
        return;
    }

    state.currentSourceIndex =
        index;

    renderSources();

    const video =
        elements.video;

    try {
        video.pause();
    } catch {}

    video.removeAttribute(
        'src'
    );

    while (
        video.firstChild
    ) {
        video.removeChild(
            video.firstChild
        );
    }

    const mime =
        getMimeType(source);

    if (mime) {
        const sourceElement =
            document.createElement(
                'source'
            );

        sourceElement.src =
            source.url;

        sourceElement.type =
            mime;

        video.appendChild(
            sourceElement
        );
    } else {
        video.src =
            source.url;
    }

    video.load();

    const progress =
        getProgress(
            state.currentTitle
        );

    const restorePosition =
        () => {
            if (
                progress > 0 &&
                Number.isFinite(
                    video.duration
                ) &&
                progress <
                    video.duration - 5
            ) {
                try {
                    video.currentTime =
                        progress;
                } catch {}
            }

            video.removeEventListener(
                'loadedmetadata',
                restorePosition
            );
        };

    video.addEventListener(
        'loadedmetadata',
        restorePosition
    );

    elements.playerStatus.textContent =
        `Loading ${sourceLabel(source, index)}...`;

    video.addEventListener(
        'canplay',
        () => {
            elements.playerStatus.textContent =
                `Playing ${sourceLabel(source, index)}`;

            attemptAutoplay();
        },
        {
            once:true
        }
    );

    video.addEventListener(
        'error',
        () => {
            elements.playerStatus.textContent =
                'This source could not be played in the browser. Try another source.';
        },
        {
            once:true
        }
    );

    attemptAutoplay();
}

async function openPlayer(item) {
    if (!item) return;

    state.currentTitle =
        normalizeItem(item);

    state.currentSources = [];
    state.currentSourceIndex = -1;

    elements.playerOverlay.classList.add(
        'open'
    );

    elements.playerTitle.textContent =
        item.title;

    elements.playerStatus.textContent =
        'Finding playable sources...';

    elements.sourceList.replaceChildren();

    try {
        const data =
            await request(
                `/api/sources/${encodeURIComponent(item.id)}`
            );

        const raw =
            Array.isArray(data?.sources)
                ? data.sources
                : Array.isArray(data)
                    ? data
                    : [];

        state.currentSources =
            raw
                .map(normalizeSource)
                .filter(sourceIsUsable);

        if (
            state.currentSources.length === 0
        ) {
            elements.playerStatus.textContent =
                'No playable sources were returned for this title.';

            showToast(
                'No playable source was found.',
                'error'
            );

            return;
        }

        renderSources();

        /*
            Prefer the first source returned by
            the backend. The backend decides its
            source ordering.
        */
        playSource(0);

    } catch (error) {
        console.error(error);

        elements.playerStatus.textContent =
            error.message ||
            'Unable to find a playable source.';

        showToast(
            error.message ||
            'Unable to load sources.',
            'error'
        );
    }
}

/* ---------------------------------------------------------
   Player progress
--------------------------------------------------------- */

elements.video.addEventListener(
    'timeupdate',
    () => {
        if (!state.currentTitle) {
            return;
        }

        if (
            elements.video.currentTime >
            5
        ) {
            saveProgress(
                state.currentTitle,
                elements.video.currentTime
            );
        }
    }
);

elements.video.addEventListener(
    'ended',
    () => {
        if (
            state.currentTitle
        ) {
            clearProgress(
                state.currentTitle
            );
        }
    }
);

   Extensions
--------------------------------------------------------- */

async function openExtensions() {
    elements.extensionsOverlay.classList.add(
        'open'
    );

    elements.extensionList.innerHTML =
        '<div class="loading"><div class="spinner"></div></div>';

    try {
        const data =
            await request(
                '/api/extensions'
            );

        const extensions =
            Array.isArray(data?.extensions)
                ? data.extensions
                : Array.isArray(data)
                    ? data
                    : [];

        renderExtensions(
            extensions
        );

    } catch (error) {
        console.error(error);

        elements.extensionList.innerHTML =
            `<div class="empty">${escapeHtml(error.message)}</div>`;
    }
}

function renderExtensions(
    extensions
) {
    elements.extensionList.replaceChildren();

    if (
        extensions.length === 0
    ) {
        elements.extensionList.innerHTML =
            '<div class="empty">No extensions have been discovered yet.</div>';

        return;
    }

    extensions.forEach(extension => {
        const row =
            document.createElement('div');

        row.className = 'extension';

        const left =
            document.createElement('div');

        const name =
            document.createElement('div');

        name.className =
            'extension-name';

        name.textContent =
            extension.name ||
            extension.internalName ||
            'Unnamed extension';

        const meta =
            document.createElement('div');

        meta.className =
            'extension-meta';

        const metaParts = [
            extension.version
                ? `v${extension.version}`
                : '',
            extension.language
                ? extension.language
                : '',
            extension.repositoryUrl
                ? 'Repository'
                : ''
        ].filter(Boolean);

        meta.textContent =
            metaParts.join(' • ');

        left.appendChild(name);
        left.appendChild(meta);

        const status =
            document.createElement('span');

        const healthy =
            extension.status ===
                'ok' ||
            extension.enabled === true ||
            extension.status ===
                'active';

        status.className =
            `extension-status ${healthy ? 'ok' : 'bad'}`;

        status.textContent =
            extension.status ||
            (
                extension.enabled
                    ? 'Enabled'
                    : 'Discovered'
            );

        row.appendChild(left);
        row.appendChild(status);

        elements.extensionList.appendChild(
            row
        );
    });
}

/* ---------------------------------------------------------
   Synchronization
--------------------------------------------------------- */

async function syncEverything() {
    if (state.syncInProgress) {
        return;
    }

    state.syncInProgress = true;

    elements.refreshButton.disabled =
        true;

    setStatus(
        'Synchronizing',
        'Updating extensions and rebuilding the library...'
    );

    try {
        let data;

        try {
            data =
                await request(
                    '/api/sync',
                    {
                        method:'POST'
                    }
                );
        } catch {
            /*
                Older/current server versions may
                expose extension synchronization
                separately.
            */
            await request(
                '/api/extensions/sync',
                {
                    method:'POST'
                }
            );
        }

        const count =
            data?.count ??
            data?.library?.length ??
            '';

        showToast(
            count !== ''
                ? `Synchronization complete — ${count} titles available.`
                : 'Synchronization complete.',
            'success'
        );

    } catch (error) {
        console.error(error);

        showToast(
            error.message ||
            'Synchronization failed.',
            'error'
        );
    } finally {
        state.syncInProgress =
            false;

        elements.refreshButton.disabled =
            false;

        if (
            elements.searchInput.value.trim()
        ) {
            await searchEverything(
                elements.searchInput.value
            );
        } else {
            await loadLibrary();
        }
    }
}

/* ---------------------------------------------------------
   Health
--------------------------------------------------------- */

async function loadHealth() {
    try {
        const data =
            await request(
                '/api/health'
            );

        const parts = [];

        if (
            Number.isFinite(
                Number(data?.libraryCount)
            )
        ) {
            parts.push(
                `${data.libraryCount} titles`
            );
        }

        if (
            Number.isFinite(
                Number(data?.extensionCount)
            )
        ) {
            parts.push(
                `${data.extensionCount} extensions`
            );
        }

        if (
            data?.status
        ) {
            parts.push(
                String(data.status)
            );
        }

        if (parts.length) {
            elements.statusSub.textContent =
                parts.join(' • ');
        }

    } catch (error) {
        console.warn(
            'Health check failed:',
            error
        );
    }
}

/* ---------------------------------------------------------
   Modal handling
--------------------------------------------------------- */

function closeDetails() {
    elements.detailOverlay.classList.remove(
        'open'
    );
}

function closeExtensions() {
    elements.extensionsOverlay.classList.remove(
        'open'
    );
}

function closeAllModals() {
    closePlayer();
    closeDetails();
    closeExtensions();
}

function overlayClickToClose(
    overlay,
    closeFunction
) {
    overlay.addEventListener(
        'click',
        event => {
            if (
                event.target ===
                overlay
            ) {
                closeFunction();
            }
        }
    );
}

/* ---------------------------------------------------------
   Events
--------------------------------------------------------- */

elements.searchInput.addEventListener(
    'input',
    () => {
        const hasValue =
            elements.searchInput.value.length >
            0;

        elements.searchClear.classList.toggle(
            'hidden',
            !hasValue
        );

        scheduleSearch();
    }
);

elements.searchInput.addEventListener(
    'keydown',
    event => {
        if (
            event.key === 'Enter'
        ) {
            event.preventDefault();

            clearTimeout(
                state.searchTimer
            );

            searchEverything(
                elements.searchInput.value
            );
        }

        if (
            event.key === 'Escape'
        ) {
            elements.searchInput.value =
                '';

            elements.searchClear.classList.add(
                'hidden'
            );

            loadLibrary();
        }
    }
);

elements.searchClear.addEventListener(
    'click',
    () => {
        elements.searchInput.value =
            '';

        elements.searchClear.classList.add(
            'hidden'
        );

        loadLibrary();

        elements.searchInput.focus();
    }
);

elements.typeSelect.addEventListener(
    'change',
    applyFilters
);

elements.providerSelect.addEventListener(
    'change',
    () => {
        const filtered =
            renderResults(
                state.results
            );

        setStatus(
            filtered.length === 1
                ? '1 result'
                : `${filtered.length} results`,
            state.lastMode === 'search'
                ? `Search: ${state.lastQuery}`
                : 'Library'
        );
    }
);

elements.refreshButton.addEventListener(
    'click',
    syncEverything
);

elements.extensionsButton.addEventListener(
    'click',
    openExtensions
);

elements.closePlayer.addEventListener(
    'click',
    closePlayer
);

elements.closeDetail.addEventListener(
    'click',
    closeDetails
);

elements.closeExtensions.addEventListener(
    'click',
    closeExtensions
);

overlayClickToClose(
    elements.playerOverlay,
    closePlayer
);

overlayClickToClose(
    elements.detailOverlay,
    closeDetails
);

overlayClickToClose(
    elements.extensionsOverlay,
    closeExtensions
);

document.addEventListener(
    'keydown',
    event => {
        if (
            event.key !== 'Escape'
        ) {
            return;
        }

        if (
            elements.playerOverlay.classList.contains(
                'open'
            )
        ) {
            closePlayer();
            return;
        }

        if (
            elements.detailOverlay.classList.contains(
                'open'
            )
        ) {
            closeDetails();
            return;
        }

        if (
            elements.extensionsOverlay.classList.contains(
                'open'
            )
        ) {
            closeExtensions();
        }
    }
);

/* ---------------------------------------------------------
   Startup
--------------------------------------------------------- */

async function initialize() {
    setStatus(
        'Mediav2',
        'Starting...'
    );

    await Promise.allSettled([
        loadHealth(),
        loadLibrary()
    ]);
}

initialize();
</script>
