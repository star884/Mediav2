name: Build Mediav2 CloudStream Runtime

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "runtime/**"
      - ".github/workflows/build.yml"
      - "Dockerfile"
      - "start.sh"
      - "server.js"
      - "package.json"

permissions:
  contents: write

concurrency:
  group: mediav2-runtime-build
  cancel-in-progress: true

jobs:
  build-runtime:
    name: Build Mediav2 Runtime
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Mediav2
        uses: actions/checkout@v4
        with:
          path: mediav2
          fetch-depth: 1

      - name: Checkout CloudStream
        uses: actions/checkout@v4
        with:
          repository: DHR-Store/CS-3
          ref: main
          path: runtime-host
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate files
        shell: bash
        run: |
          set -euo pipefail

          test -f mediav2/runtime/BridgeServer.kt
          test -f mediav2/runtime/build.gradle.kts
          test -f runtime-host/settings.gradle.kts
          test -f runtime-host/gradlew

      - name: Install Mediav2 module
        shell: bash
        run: |
          set -euo pipefail

          cd runtime-host

          rm -rf mediav2-runtime

          mkdir -p mediav2-runtime/src/main/kotlin/com/star884/mediav2/runtime

          cp ../mediav2/runtime/BridgeServer.kt \
            mediav2-runtime/src/main/kotlin/com/star884/mediav2/runtime/BridgeServer.kt

          cp ../mediav2/runtime/build.gradle.kts \
            mediav2-runtime/build.gradle.kts

          if ! grep -Fq 'include(":mediav2-runtime")' settings.gradle.kts; then
            printf '%s\n' 'include(":mediav2-runtime")' >> settings.gradle.kts
          fi

      - name: Make Gradle executable
        shell: bash
        run: chmod +x runtime-host/gradlew

      - name: Verify Gradle module
        working-directory: runtime-host
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :mediav2-runtime:tasks \
            --no-daemon \
            --stacktrace

      - name: Build runtime
        working-directory: runtime-host
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :mediav2-runtime:jar \
            --no-daemon \
            --stacktrace

      - name: Prepare output
        shell: bash
        run: |
          set -euo pipefail

          BUILD_LIBS="runtime-host/mediav2-runtime/build/libs"
          OUTPUT="mediav2/build/runtime"

          test -d "$BUILD_LIBS"

          JAR="$(
            find "$BUILD_LIBS" \
              -maxdepth 1 \
              -type f \
              -name '*.jar' \
              ! -name '*-plain.jar' \
              -print |
            head -n 1
          )"

          test -n "$JAR"
          test -s "$JAR"

          rm -rf mediav2/build
          mkdir -p "$OUTPUT"

          cp \
            "$JAR" \
            "$OUTPUT/mediav2-runtime.jar"

          sha256sum \
            "$OUTPUT/mediav2-runtime.jar" \
            > "$OUTPUT/mediav2-runtime.jar.sha256"

          SOURCE_COMMIT="$(git -C runtime-host rev-parse HEAD)"
          MEDIAV2_COMMIT="$(git -C mediav2 rev-parse HEAD)"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          printf '%s\n' \
            '{' \
            '  "name": "Mediav2 CloudStream Runtime",' \
            '  "artifact": "mediav2-runtime.jar",' \
            "  \"builtAt\": \"$BUILT_AT\"," \
            '  "sourceRepository": "DHR-Store/CS-3",' \
            '  "sourceRef": "main",' \
            "  \"sourceCommit\": \"$SOURCE_COMMIT\"," \
            "  \"mediav2Commit\": \"$MEDIAV2_COMMIT\"" \
            '}' \
            > "$OUTPUT/version.json"

          echo "Build output:"
          find mediav2/build -type f -print

          echo
          echo "SHA256:"
          cat "$OUTPUT/mediav2-runtime.jar.sha256"

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediav2-runtime
          path: mediav2/build/runtime/
          if-no-files-found: error
          retention-days: 7

      - name: Publish runtime
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: builds
          publish_dir: ./mediav2/build
          keep_files: true
          force_orphan: false
          commit_message: "Build Mediav2 CloudStream runtime"

      - name: Trigger Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set. Skipping Render."
            exit 0
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            -X POST \
            "$RENDER_DEPLOY_HOOK_URL"
