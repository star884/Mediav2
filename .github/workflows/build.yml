name: Build and Bundle Extensions for Render

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Compile CloudStream Plugins
        run: ./gradlew make

      - name: Create Web Landing Page
        run: |
          cat << 'EOF' > build/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <title>CloudStream Repository</title>
              <style>
                  body { font-family: sans-serif; background: #121212; color: #fff; padding: 2rem; }
                  a { color: #00e676; text-decoration: none; font-size: 1.2rem; }
                  .container { max-width: 600px; margin: auto; }
                  .card { background: #1e1e1e; padding: 1.5rem; border-radius: 8px; margin-top: 1rem; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>CloudStream Extension Repository</h1>
                  <div class="card">
                      <p>Repository Manifest URL:</p>
                      <a href="plugins.json">plugins.json</a>
                  </div>
              </div>
          </body>
          </html>
          EOF

      - name: Publish Built Files to 'builds' Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: builds
          force_orphan: true
