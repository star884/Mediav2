name: Build Mediav2 CloudStream Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-runtime:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Mediav2
        uses: actions/checkout@v4

      - name: Checkout JVM CloudStream runtime
        uses: actions/checkout@v4
        with:
          repository: DHR-Store/CS-3
          path: runtime-host
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Copy Mediav2 runtime
        shell: bash
        run: |
          mkdir -p runtime-host/mediav2-runtime/src/main/kotlin/com/star884/mediav2/runtime

          cp runtime/BridgeServer.kt \
            runtime-host/mediav2-runtime/src/main/kotlin/com/star884/mediav2/runtime/BridgeServer.kt

          cp runtime/build.gradle.kts \
            runtime-host/mediav2-runtime/build.gradle.kts

      - name: Register runtime module
        shell: bash
        working-directory: runtime-host
        run: |
          if ! grep -q 'include(":mediav2-runtime")' settings.gradle.kts; then
            printf '\ninclude(":mediav2-runtime")\n' >> settings.gradle.kts
          fi

      - name: Build runtime
        working-directory: runtime-host
        run: |
          chmod +x ./gradlew
          ./gradlew :mediav2-runtime:jar \
            --no-daemon \
            --stacktrace

      - name: Prepare artifact
        shell: bash
        run: |
          rm -rf build/runtime
          mkdir -p build/runtime

          cp runtime-host/mediav2-runtime/build/libs/*.jar \
            build/runtime/mediav2-runtime.jar

          ls -lh build/runtime

      - name: Publish runtime
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: builds
          publish_dir: ./build
          keep_files: true
          force_orphan: false
          commit_message: "Build Mediav2 CloudStream JVM runtime"
