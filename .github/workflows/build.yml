name: Build Mediav2 Extensions

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

env:
  STREAMPLAY_REPOSITORY: tpadev/phiser-streamplay
  STREAMPLAY_ARTIFACT_URL: https://raw.githubusercontent.com/tpadev/phiser-streamplay/builds/StreamPlay.cs3
  STREAMPLAY_MANIFEST_URL: https://raw.githubusercontent.com/tpadev/phiser-streamplay/builds/plugins.json

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout Mediav2
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # Java
      # ---------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # Gradle
      # ---------------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # ---------------------------------------------------------
      # Build Mediav2's own extensions
      # ---------------------------------------------------------
      - name: Build extensions
        run: ./gradlew make

      # ---------------------------------------------------------
      # Verify normal build
      # ---------------------------------------------------------
      - name: Verify generated files
        shell: bash
        run: |
          set -e

          echo "Generated files:"
          find build -maxdepth 4 -type f -print || true

          test -d build

      # ---------------------------------------------------------
      # Install tools used for manifest merging
      # ---------------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ---------------------------------------------------------
      # Download the official StreamPlay artifact
      #
      # We intentionally do NOT reimplement StreamPlay here.
      # The official .cs3 remains the executable CloudStream plugin.
      # ---------------------------------------------------------
      - name: Download StreamPlay
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 20 \
            --max-time 300 \
            -o build/StreamPlay.cs3 \
            "$STREAMPLAY_ARTIFACT_URL"

          test -s build/StreamPlay.cs3

          echo "StreamPlay downloaded:"
          ls -lh build/StreamPlay.cs3

      # ---------------------------------------------------------
      # Download the official StreamPlay manifest
      # ---------------------------------------------------------
      - name: Download StreamPlay manifest
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 20 \
            --max-time 120 \
            -o /tmp/streamplay-plugins.json \
            "$STREAMPLAY_MANIFEST_URL"

          test -s /tmp/streamplay-plugins.json

          node -e '
            const fs = require("fs");

            const data = JSON.parse(
              fs.readFileSync("/tmp/streamplay-plugins.json", "utf8")
            );

            if (!Array.isArray(data)) {
              throw new Error("Upstream plugins.json is not an array");
            }

            const streamPlay = data.find(p =>
              String(p?.internalName || "").toLowerCase() === "streamplay" ||
              String(p?.name || "").toLowerCase() === "streamplay"
            );

            if (!streamPlay) {
              throw new Error("StreamPlay was not found in upstream plugins.json");
            }

            console.log(
              JSON.stringify(
                {
                  internalName: streamPlay.internalName,
                  name: streamPlay.name,
                  version: streamPlay.version,
                  fileSize: streamPlay.fileSize,
                  fileHash: streamPlay.fileHash,
                  repositoryUrl: streamPlay.repositoryUrl
                },
                null,
                2
              )
            );
          '

      # ---------------------------------------------------------
      # Merge StreamPlay into Mediav2's generated plugins.json
      #
      # Existing Mediav2 extensions are preserved.
      # StreamPlay is replaced by the newest upstream entry.
      # ---------------------------------------------------------
      - name: Integrate StreamPlay into plugin manifest
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");
          const crypto = require("crypto");

          const localPath = "build/plugins.json";
          const upstreamPath = "/tmp/streamplay-plugins.json";

          if (!fs.existsSync(localPath)) {
            throw new Error(
              "Mediav2 did not generate build/plugins.json"
            );
          }

          const local = JSON.parse(
            fs.readFileSync(localPath, "utf8")
          );

          const upstream = JSON.parse(
            fs.readFileSync(upstreamPath, "utf8")
          );

          if (!Array.isArray(local)) {
            throw new Error(
              "Mediav2 build/plugins.json must contain an array"
            );
          }

          if (!Array.isArray(upstream)) {
            throw new Error(
              "Upstream plugins.json must contain an array"
            );
          }

          const streamPlay = upstream.find(plugin => {
            const internalName =
              String(plugin?.internalName || "").toLowerCase();

            const name =
              String(plugin?.name || "").toLowerCase();

            return (
              internalName === "streamplay" ||
              name === "streamplay"
            );
          });

          if (!streamPlay) {
            throw new Error(
              "StreamPlay was not found in upstream manifest"
            );
          }

          const artifactPath = "build/StreamPlay.cs3";

          if (!fs.existsSync(artifactPath)) {
            throw new Error(
              "build/StreamPlay.cs3 does not exist"
            );
          }

          const stat = fs.statSync(artifactPath);

          const fileHash = crypto
            .createHash("sha256")
            .update(fs.readFileSync(artifactPath))
            .digest("hex");

          /*
           * Point StreamPlay at YOUR Mediav2 builds branch.
           *
           * GITHUB_REPOSITORY is automatically:
           * star884/Mediav2
           */
          const repository =
            process.env.GITHUB_REPOSITORY;

          if (!repository) {
            throw new Error(
              "GITHUB_REPOSITORY is unavailable"
            );
          }

          const adapted = {
            ...streamPlay,

            name:
              streamPlay.name || "StreamPlay",

            internalName:
              streamPlay.internalName || "StreamPlay",

            /*
             * The actual executable plugin is now hosted
             * by Mediav2's builds branch.
             */
            url:
              `https://raw.githubusercontent.com/${repository}/builds/StreamPlay.cs3`,

            /*
             * Keep the official project as the source repository.
             */
            repositoryUrl:
              streamPlay.repositoryUrl ||
              `https://github.com/${process.env.STREAMPLAY_REPOSITORY}`,

            /*
             * Keep these synchronized with the artifact that
             * is actually published by this workflow.
             */
            fileSize:
              stat.size,

            fileHash:
              fileHash
          };

          /*
           * Remove an older StreamPlay entry from Mediav2.
           */
          const filtered = local.filter(plugin => {
            const internalName =
              String(plugin?.internalName || "").toLowerCase();

            const name =
              String(plugin?.name || "").toLowerCase();

            return (
              internalName !== "streamplay" &&
              name !== "streamplay"
            );
          });

          /*
           * StreamPlay goes first so it is easy to verify.
           */
          const merged = [
            adapted,
            ...filtered
          ];

          /*
           * Remove duplicate plugins while preserving order.
           */
          const seen = new Set();

          const finalPlugins = merged.filter(plugin => {
            const key = String(
              plugin?.internalName ||
              plugin?.name ||
              plugin?.url ||
              ""
            ).toLowerCase();

            if (!key || seen.has(key)) {
              return false;
            }

            seen.add(key);
            return true;
          });

          fs.writeFileSync(
            localPath,
            JSON.stringify(finalPlugins, null, 2) + "\n",
            "utf8"
          );

          console.log(
            `Integrated StreamPlay v${adapted.version || "unknown"}`
          );

          console.log(
            `StreamPlay size: ${adapted.fileSize} bytes`
          );

          console.log(
            `StreamPlay SHA-256: ${adapted.fileHash}`
          );

          console.log(
            `StreamPlay URL: ${adapted.url}`
          );

          console.log(
            `Total plugins: ${finalPlugins.length}`
          );
          NODE

      # ---------------------------------------------------------
      # Final validation
      # ---------------------------------------------------------
      - name: Validate final plugin repository
        shell: bash
        run: |
          set -euo pipefail

          test -s build/StreamPlay.cs3
          test -s build/plugins.json

          node <<'NODE'
          const fs = require("fs");

          const plugins =
            JSON.parse(
              fs.readFileSync(
                "build/plugins.json",
                "utf8"
              )
            );

          if (!Array.isArray(plugins)) {
            throw new Error(
              "Final plugins.json is not an array"
            );
          }

          const streamPlay =
            plugins.find(plugin =>
              String(
                plugin?.internalName || ""
              ).toLowerCase() === "streamplay"
            );

          if (!streamPlay) {
            throw new Error(
              "Final plugins.json does not contain StreamPlay"
            );
          }

          if (
            !String(
              streamPlay.url || ""
            ).includes(
              "/builds/StreamPlay.cs3"
            )
          ) {
            throw new Error(
              "StreamPlay does not point to Mediav2's builds artifact"
            );
          }

          if (
            !Number.isFinite(
              Number(streamPlay.fileSize)
            ) ||
            Number(streamPlay.fileSize) <= 0
          ) {
            throw new Error(
              "StreamPlay fileSize is invalid"
            );
          }

          if (
            !/^[a-f0-9]{64}$/i.test(
              String(streamPlay.fileHash || "")
            )
          ) {
            throw new Error(
              "StreamPlay fileHash is not a SHA-256 hash"
            );
          }

          console.log(
            "StreamPlay manifest validation: OK"
          );

          console.log(
            JSON.stringify(
              streamPlay,
              null,
              2
            )
          );
          NODE

          echo
          echo "Final build:"
          find build -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      # ---------------------------------------------------------
      # Publish everything to builds branch
      # ---------------------------------------------------------
      - name: Publish extension repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: builds
          force_orphan: true
